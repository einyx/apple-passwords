name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --workspace
      - name: Test
        run: cargo test --locked --workspace
      - name: Check the formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings

  flatpak:
    name: flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub/flatpak-builder:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Flatpak
        run: |
          flatpak-builder --user --install --force-clean --disable-roofs-fuse \
            --repo=flatpak-repo packaging/org.icp.passwords.yml
          flatpak build-bundle flatpak-repo build.flatpak org.icp.passwords
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: build.flatpak
