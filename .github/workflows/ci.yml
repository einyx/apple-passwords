name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --workspace
      - name: Test
        run: cargo test --locked --workspace
      - name: Check the formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings

  flatpak:
    name: flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder and the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder flatpak \
            libgtk-4-dev libadwaita-1-dev libssl-dev pkg-config
      - name: Build the Flatpak
        run: |
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49
          # The binaries are built on the runner and the Flatpak packages them:
          # the Rust SDK extension cannot be resolved by the Flatpak builder.
          cargo build --release --locked --workspace
          mkdir -p staging
          cp target/release/icp-gui target/release/icp-cli target/release/icp-host staging/
          flatpak-builder --force-clean --state-dir=/tmp/fpstate \
            --repo=flatpak-repo build-flatpak packaging/org.icp.passwords.json
          flatpak build-bundle flatpak-repo build.flatpak org.icp.passwords
          flatpak build-bundle flatpak-repo build.flatpak org.icp.passwords
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: build.flatpak
