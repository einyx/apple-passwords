name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to release
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            deb-arch: amd64
            rpm-arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb-arch: arm64
            rpm-arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libssl-dev pkg-config dpkg-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --workspace
      - name: Test
        run: cargo test --release --locked --workspace
      - name: The .deb
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/build-deb.sh "$version" "${{ matrix.deb-arch }}" \
            "apple-passwords_${version}_${{ matrix.deb-arch }}.deb"
      - name: The .rpm
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS ~/rpmbuild/BUILD ~/rpmbuild/RPMS
          # git archive, so the tarball holds the sources and not the build tree.
          git archive --format=tar.gz --prefix="apple-passwords-${version}/" \
            -o ~/rpmbuild/SOURCES/apple-passwords-${version}.tar.gz HEAD
          cp packaging/apple-passwords.spec ~/rpmbuild/SPECS/
          # --nodeps: the build requirements are the apt packages above; rpm on
          # Ubuntu does not know their RPM names.
          rpmbuild --nodeps --define "_topdir ~/rpmbuild" --define "_version $version" \
            --define "_arch ${{ matrix.rpm-arch }}" \
            -bb ~/rpmbuild/SPECS/apple-passwords.spec
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} . \;
      - name: The binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/apple-passwords_${version}_${{ matrix.arch }}
          cp target/release/icp-gui target/release/icp-cli target/release/icp-host \
            dist/apple-passwords_${version}_${{ matrix.arch }}/
          cp README.md LICENSE dist/apple-passwords_${version}_${{ matrix.arch }}/
          cp crates/icp-gui/icons/org.icp.passwords.svg \
            dist/apple-passwords_${version}_${{ matrix.arch }}/
          tar czf apple-passwords_${version}_${{ matrix.arch }}.tar.gz \
            -C dist apple-passwords_${version}_${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            apple-passwords_*.deb
            apple-passwords_*.rpm
            apple-passwords_*.tar.gz

  flatpak:
    name: flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder and the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder flatpak \
            libgtk-4-dev libadwaita-1-dev libssl-dev pkg-config
      - name: Build
        run: |
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49
          # The binaries are built on the runner and the Flatpak packages them:
          # the Rust SDK extension cannot be resolved by the Flatpak builder.
          cargo build --release --locked --workspace
          mkdir -p staging
          cp target/release/icp-gui target/release/icp-cli target/release/icp-host staging/
          flatpak-builder --force-clean --state-dir=/tmp/fpstate \
            --repo=flatpak-repo build-flatpak packaging/org.icp.passwords.json
          flatpak build-bundle flatpak-repo build.flatpak org.icp.passwords
          flatpak build-bundle flatpak-repo build.flatpak org.icp.passwords
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: build.flatpak

  release:
    name: publish
    runs-on: ubuntu-24.04
    needs: [build, flatpak]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.deb *.rpm *.tar.gz build.flatpak > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Apple Passwords ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE.md
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.tar.gz
            artifacts/build.flatpak
            artifacts/SHA256SUMS
