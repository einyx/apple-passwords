[workspace]
resolver = "2"
members = ["crates/icp-core", "crates/icp-cli", "crates/icp-gui", "crates/icp-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/einyx/apple-passwords"

[workspace.dependencies]
icp-core = { path = "crates/icp-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "blocking"] }
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
plist = "1.7"
