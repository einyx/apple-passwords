[package]
name = "icp-core"
description = "The iCloud Keychain client core: CloudKit records, the keychain unwrap chain, and writes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
aes-siv = "0.7"
base64.workspace = true
crypto_secretbox = "0.1"
flate2.workspace = true
hex.workspace = true
hmac.workspace = true
plist.workspace = true
p384 = { version = "0.13", features = ["ecdsa", "ecdh"] }
num-bigint = "0.4"
num-traits = "0.2"
rand.workspace = true
secret-service = { version = "3", features = ["rt-async-io-crypto-rust"] }
zbus = { version = "3", default-features = false, features = ["async-io"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
hex.workspace = true
