[package]
name = "icp-gui"
description = "A desktop app for Apple Passwords on Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
icp-core.workspace = true
anyhow.workspace = true
glib = "0.22"
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_2", "v1_4", "v1_5"] }
ksni = { version = "0.3.7", features = ["blocking"] }
