<?xml version="1.0" encoding="UTF-8"?>
<!-- The app icon: a keyhole on a blue tile. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cb3ff"/>
      <stop offset="0.45" stop-color="#2f7bf0"/>
      <stop offset="1" stop-color="#2b3ae0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#gloss)"/>

  <!-- The keyhole: a circle over a slot that tapers to a point. -->
  <g filter="url(#drop)" fill="#ffffff">
    <circle cx="256" cy="212" r="74"/>
    <path d="M 230 262
             L 282 262
             C 282 262 276 330 262 386
             C 258 400 254 400 250 386
             C 236 330 230 262 230 262
             Z"/>
  </g>
</svg>
