app-id: org.icp.passwords
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
base: org.gnome.Base
base-version: '49'
command: icp-gui

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The Secret Service, for the master key of the vault.
  - --talk-name=org.freedesktop.secrets
  # The anisette server on the loopback.
  - --share=network
  --talk-name=org.freedesktop.Notifications

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable//25.08

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/apple-passwords/cargo
    RUST_BACKTRACE: '1'

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - /share/gtk-doc
  - '*.la'
  - '*.a'

modules:
  - name: apple-passwords
    buildsystem: simple
    build-commands:
      # The build has no network once it starts, so the crates are vendored first.
      - cargo vendor --locked vendor
      - cargo build --release --locked --offline
      - install -Dm755 target/release/icp-gui /app/bin/icp-gui
      - install -Dm755 target/release/icp-cli /app/bin/icp-cli
      - install -Dm755 target/release/icp-host /app/bin/icp-host
      - install -Dm644 crates/icp-gui/icons/org.icp.passwords.svg
        /app/share/icons/hicolor/scalable/apps/org.icp.passwords.svg
      - install -Dm644 crates/icp-gui/data/org.icp.passwords.desktop
        /app/share/applications/org.icp.passwords.desktop
    sources:
      - type: dir
        path: ..
